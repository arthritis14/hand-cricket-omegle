<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMin slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8CC8FF"/>
      <stop offset="1" stop-color="#E4F2FF"/>
    </linearGradient>
    <pattern id="crowdPink" width="18" height="14" patternUnits="userSpaceOnUse">
      <rect width="18" height="14" fill="#FFD60A"/>
      <circle cx="4" cy="4" r="3" fill="#fff"/><circle cx="13" cy="5" r="3" fill="#6FA8FF"/>
      <circle cx="9" cy="11" r="3" fill="#FF6FB5"/><circle cx="1" cy="12" r="2" fill="#000"/>
    </pattern>
    <pattern id="crowdBlue" width="18" height="14" patternUnits="userSpaceOnUse">
      <rect width="18" height="14" fill="#6FA8FF"/>
      <circle cx="4" cy="4" r="3" fill="#fff"/><circle cx="13" cy="5" r="3" fill="#FF6FB5"/>
      <circle cx="9" cy="11" r="3" fill="#FFD60A"/><circle cx="16" cy="13" r="2" fill="#000"/>
    </pattern>
  </defs>
  <g stroke="#000" stroke-width="5" stroke-linejoin="round">
    <rect width="1600" height="900" fill="url(#sky)" stroke="none"/>

    <!-- clouds -->
    <g fill="#fff" stroke="none">
      <ellipse cx="240" cy="90" rx="110" ry="28"/><ellipse cx="310" cy="72" rx="64" ry="24"/>
      <ellipse cx="1180" cy="70" rx="120" ry="30"/><ellipse cx="1260" cy="52" rx="66" ry="24"/>
    </g>

    <!-- floodlight towers -->
    <g fill="#c9d6e8">
      <rect x="168" y="120" width="14" height="230"/><rect x="1418" y="120" width="14" height="230"/>
      <rect x="470" y="170" width="12" height="190"/><rect x="1118" y="170" width="12" height="190"/>
    </g>
    <g fill="#fff">
      <rect x="120" y="70" width="110" height="64" rx="4"/><rect x="1370" y="70" width="110" height="64" rx="4"/>
      <rect x="436" y="130" width="80" height="48" rx="4"/><rect x="1084" y="130" width="80" height="48" rx="4"/>
    </g>
    <g stroke-width="3" fill="none">
      <path d="M120 102 H230 M175 70 V134 M1370 102 H1480 M1425 70 V134"/>
    </g>

    <!-- scoreboard -->
    <rect x="770" y="200" width="14" height="110" fill="#c9d6e8"/><rect x="816" y="200" width="14" height="110" fill="#c9d6e8"/>
    <rect x="690" y="118" width="220" height="100" fill="#000"/>
    <g stroke="none"><rect x="710" y="136" width="70" height="26" fill="#FFD60A"/><rect x="800" y="136" width="90" height="26" fill="#FF6FB5"/>
    <rect x="710" y="176" width="180" height="22" fill="#6FA8FF"/></g>

    <!-- outfield, drawn first so the stands sit on it -->
    <rect x="0" y="440" width="1600" height="520" fill="#9BE564" stroke="none"/>
    <g stroke="none" fill="#86D656">
      <rect x="0" y="520" width="1600" height="30"/><rect x="0" y="592" width="1600" height="38"/>
      <rect x="0" y="676" width="1600" height="48"/><rect x="0" y="778" width="1600" height="62"/>
    </g>
    <!-- the pitch: tan dirt narrowing away from us -->
    <path d="M534 940 L720 482 H880 L1066 940 Z" fill="#E2BE82" stroke-width="4"/>
    <g stroke="#C9A064" stroke-width="12" fill="none">
      <path d="M690 540 L910 540 M670 590 L930 590 M646 650 L954 650 M620 722 L980 722 M588 810 L1012 810"/>
    </g>
    <path d="M716 492 L884 492 M596 760 L1004 760" stroke-width="4" fill="none"/>
    <!-- far stumps -->
    <g fill="#FFF3C4" stroke-width="3">
      <rect x="786" y="460" width="7" height="32"/><rect x="797" y="460" width="7" height="32"/><rect x="808" y="460" width="7" height="32"/>
    </g>
    <path d="M785 459 H816" stroke-width="4" fill="none"/>
    <!-- near stumps -->
    <g fill="#FFF3C4" stroke-width="4">
      <rect x="766" y="698" width="14" height="62"/><rect x="793" y="698" width="14" height="62"/><rect x="820" y="698" width="14" height="62"/>
    </g>
    <path d="M762 695 H838" stroke-width="6" fill="none"/>

    <!-- upper stand roof and seating -->
    <path d="M-10 292 Q800 232 1610 292 L1610 318 Q800 258 -10 318 Z" fill="#fff"/>
    <path d="M-10 318 Q800 258 1610 318 L1610 392 Q800 332 -10 392 Z" fill="url(#crowdPink)"/>
    <!-- lower tier -->
    <path d="M-10 392 Q800 332 1610 392 L1610 462 Q800 402 -10 462 Z" fill="url(#crowdBlue)"/>
    <!-- aisles -->
    <g stroke-width="4" fill="none">
      <path d="M200 318 L170 460 M440 306 L420 450 M680 296 L672 440 M920 296 L928 440 M1160 306 L1180 450 M1400 318 L1430 460" opacity="0.55"/>
    </g>
    <!-- hoarding band -->
    <path d="M-10 462 Q800 402 1610 462 L1610 494 Q800 434 -10 494 Z" fill="#fff"/>
    <g stroke="none">
      <path d="M100 470 L330 462 L330 482 L100 490 Z" fill="#FF6FB5"/>
      <path d="M520 450 L760 436 L760 456 L520 470 Z" fill="#6FA8FF"/>
      <path d="M840 436 L1080 450 L1080 470 L840 456 Z" fill="#FFD60A"/>
      <path d="M1270 462 L1500 470 L1500 490 L1270 482 Z" fill="#FF6FB5"/>
    </g>
  </g>
</svg>
