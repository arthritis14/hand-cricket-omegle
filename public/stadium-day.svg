<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" preserveAspectRatio="xMidYMin slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fb3ff"/>
      <stop offset="0.55" stop-color="#b9e4ff"/>
      <stop offset="1" stop-color="#ffe3b0"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3b8"/>
      <stop offset="0.35" stop-color="#ffd25a"/>
      <stop offset="1" stop-color="#ffd25a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ad35f"/>
      <stop offset="1" stop-color="#3f9d3c"/>
    </linearGradient>
    <pattern id="crowd" width="16" height="13" patternUnits="userSpaceOnUse">
      <rect width="16" height="13" fill="#b9693f"/>
      <circle cx="3" cy="3" r="2.6" fill="#ff8a3d"/>
      <circle cx="11" cy="4" r="2.4" fill="#2f6bff"/>
      <circle cx="7" cy="9" r="2.6" fill="#fff0d6"/>
      <circle cx="14" cy="10" r="2.2" fill="#ffc84a"/>
      <circle cx="1" cy="11" r="2" fill="#e8504a"/>
    </pattern>
  </defs>

  <rect width="1600" height="640" fill="url(#sky)"/>
  <circle cx="1290" cy="130" r="210" fill="url(#sun)"/>

  <g fill="#fffaf0" opacity="0.95">
    <ellipse cx="260" cy="120" rx="120" ry="34"/><ellipse cx="340" cy="100" rx="80" ry="30"/><ellipse cx="190" cy="106" rx="70" ry="26"/>
    <ellipse cx="760" cy="70" rx="100" ry="26"/><ellipse cx="830" cy="58" rx="62" ry="22"/>
    <ellipse cx="1080" cy="210" rx="110" ry="28"/><ellipse cx="1150" cy="196" rx="64" ry="22"/>
  </g>

  <!-- floodlight towers -->
  <g fill="#8b93a7">
    <rect x="150" y="150" width="10" height="250"/><rect x="520" y="170" width="10" height="230"/>
    <rect x="1080" y="170" width="10" height="230"/><rect x="1450" y="150" width="10" height="250"/>
  </g>
  <g fill="#d9deea" stroke="#8b93a7" stroke-width="3">
    <rect x="120" y="110" width="70" height="46" rx="4"/><rect x="490" y="132" width="70" height="42" rx="4"/>
    <rect x="1050" y="132" width="70" height="42" rx="4"/><rect x="1420" y="110" width="70" height="46" rx="4"/>
  </g>

  <!-- stands: roof, packed crowd, front wall -->
  <path d="M0 300 L1600 300 L1600 332 L0 332 Z" fill="#f4e6cf"/>
  <path d="M0 332 L1600 332 L1600 470 L0 470 Z" fill="url(#crowd)"/>
  <path d="M0 332 L1600 332 L1600 350 L0 350 Z" fill="#000" opacity="0.12"/>
  <path d="M0 412 L1600 412 L1600 418 L0 418 Z" fill="#f4e6cf" opacity="0.7"/>
  <path d="M0 470 L1600 470 L1600 494 L0 494 Z" fill="#2f6bff"/>
  <path d="M0 494 L1600 494 L1600 640 L0 640 Z" fill="url(#grass)"/>
  <g fill="#fff" opacity="0.08">
    <rect x="0" y="510" width="1600" height="26"/><rect x="0" y="566" width="1600" height="26"/>
  </g>
</svg>
